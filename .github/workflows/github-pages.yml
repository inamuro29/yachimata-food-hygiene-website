name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare GitHub Pages build
        run: node .github/scripts/prepare-github-pages.mjs

      - name: Build browser-only static site
        run: pnpm exec vite build --config .github/pages/vite.config.ts

      - name: Create route entry files and verify
        run: |
          set -euxo pipefail
          test -f dist-pages/index.html
          for route in faq fees insurance join links members payment; do
            mkdir -p "dist-pages/$route"
            cp dist-pages/index.html "dist-pages/$route/index.html"
          done
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
          test -f dist-pages/faq/index.html
          test -f dist-pages/fees/index.html
          test -f dist-pages/assets/*.js
          test -f dist-pages/assets/*.css
          find dist-pages -maxdepth 3 -type f | sort

      - name: Publish to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          cd dist-pages
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy GitHub Pages from ${GITHUB_SHA}"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
