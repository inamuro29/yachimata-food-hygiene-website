name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare static GitHub Pages build
        run: node .github/scripts/prepare-github-pages.mjs

      - name: Build static site
        run: pnpm build

      - name: Verify generated site
        run: |
          set -euxo pipefail
          test -d dist/client
          find dist/client -maxdepth 5 -type f | sort | head -300
          test -f dist/client/yachimata-food-hygiene-website/index.html
          test -f dist/client/yachimata-food-hygiene-website/faq/index.html
          test -f dist/client/yachimata-food-hygiene-website/fees/index.html
          HTML_COUNT="$(find dist/client -type f -name '*.html' | wc -l)"
          test "$HTML_COUNT" -ge 8
          touch dist/client/.nojekyll

      - name: Publish to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          cd dist/client
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy GitHub Pages from ${GITHUB_SHA}"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
